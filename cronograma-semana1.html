<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronograma Semanal | LuMED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --bg: #faf5ff;
      --card: #fefbff;
      --accent: #8b5cf6;
      --blue: #3b82f6;
      --dark: #0f172a;
      --muted: #64748b;
      --border: rgba(233,213,255,0.5);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #8b5cf6 100%);
      margin: 16px 16px 12px;
      border-radius: 16px;
      padding: 20px 24px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 24px rgba(71,85,105,0.2);
    }
    .header h1 { font-size: 18px; font-weight: 800; letter-spacing: 1px; }
    .header-actions { display: flex; gap: 6px; }
    .header-actions button {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      width: 34px; height: 34px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .header-actions button:hover { background: rgba(255,255,255,0.3); }

    /* Table */
    .table-wrap {
      margin: 0 16px 16px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(71,85,105,0.08);
      border: 1px solid var(--border);
      background: var(--card);
    }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 860px; }

    thead th {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 12px 8px;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,0.08);
      letter-spacing: 0.8px;
    }
    thead th:first-child { min-width: 100px; }
    thead th:last-child { border-right: none; width: 36px; }

    tbody tr { border-bottom: 1px solid #f3e8ff; }
    tbody tr:last-child { border-bottom: none; }
    td { border-right: 1px solid #f3e8ff; vertical-align: top; padding: 0; }
    td:last-child { border-right: none; }

    /* Time */
    .td-time {
      background: #f8f5ff;
      padding: 10px 6px;
      text-align: center;
      vertical-align: middle;
    }
    .td-time input {
      background: transparent; border: none; outline: none;
      font-family: inherit; font-size: 10px; font-weight: 800;
      color: var(--accent); text-align: center; width: 100%;
    }

    /* Cell */
    .cell { padding: 6px 8px; min-height: 60px; }
    .cell:focus-within { background: rgba(59,130,246,0.04); }
    .cell-subj {
      font-size: 11px; font-weight: 800; color: var(--dark);
      border: none; outline: none; background: transparent;
      width: 100%; font-family: inherit; padding: 1px 0;
    }
    .cell-topic {
      font-size: 10px; color: #475569;
      border: none; outline: none; background: transparent;
      width: 100%; font-family: inherit; resize: none;
      min-height: 28px; line-height: 1.4; padding: 1px 0;
    }
    .cell-empty {
      color: #d4b5ff; font-size: 10px;
      padding: 18px 6px; text-align: center; cursor: pointer;
    }
    .cell-empty:hover { color: var(--accent); }

    /* Type badge */
    .tbadge {
      display: inline-block;
      padding: 1px 7px; border-radius: 999px;
      font-size: 8px; font-weight: 800; letter-spacing: 0.3px;
      cursor: pointer; border: none; font-family: inherit;
      margin-bottom: 3px;
    }
    .t-teoria { background: #dbeafe; color: #2563eb; }
    .t-questoes { background: #fee2e2; color: #dc2626; }
    .t-pratica { background: #fef3c7; color: #d97706; }
    .t-simulado { background: #e2e8f0; color: #1e293b; }
    .t-revisao { background: #ede9fe; color: #7c3aed; }
    .t-pausa { background: #f1f5f9; color: #94a3b8; }
    .t-descanso { background: #dcfce7; color: #16a34a; }
    .t-prep { background: #f1f5f9; color: #64748b; }

    /* Type dropdown */
    .tdrop {
      position: absolute; top: 100%; left: 4px; z-index: 100;
      background: #fff; border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      padding: 4px; min-width: 110px; border: 1px solid var(--border);
    }
    .tdrop button {
      display: flex; align-items: center; gap: 6px;
      width: 100%; padding: 6px 10px; border: none; border-radius: 6px;
      background: transparent; cursor: pointer;
      font-family: inherit; font-size: 10px; font-weight: 600;
      color: var(--dark); transition: background 0.1s;
    }
    .tdrop button:hover { background: #faf5ff; }
    .tdrop .dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Delete btn */
    .del-btn {
      background: transparent; border: none;
      color: #e2e8f0; cursor: pointer; font-size: 12px;
      padding: 4px; transition: color 0.15s;
    }
    .del-btn:hover { color: #ef4444; }

    /* Modal */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,0.35);
      backdrop-filter: blur(3px);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal {
      background: #fff; border-radius: 16px; padding: 20px;
      max-width: 340px; width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }
    .modal h3 { font-size: 14px; font-weight: 800; margin-bottom: 12px; }
    .modal input {
      width: 100%; padding: 10px 12px;
      border: 1px solid #e9d5ff; border-radius: 10px;
      font-family: inherit; font-size: 13px; outline: none;
    }
    .modal input:focus { border-color: var(--accent); }
    .modal-btns { display: flex; gap: 8px; margin-top: 14px; }
    .modal-btns button {
      flex: 1; padding: 9px; border-radius: 10px;
      font-family: inherit; font-size: 12px; font-weight: 700;
      cursor: pointer; border: none;
    }
    .btn-cancel { background: #f1f5f9; color: var(--muted); }
    .btn-ok { background: linear-gradient(135deg, #2563eb, #8b5cf6); color: #fff; }

    .footer {
      text-align: center; padding: 10px 0 20px;
      font-size: 10px; color: #c4b5fd; font-weight: 600;
    }

    @media (max-width: 768px) {
      .header { margin: 10px 10px 8px; padding: 16px; }
      .header h1 { font-size: 15px; }
      .table-wrap { margin: 0 10px 12px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TYPES = [
      { k: "Teoria", l: "TEORIA", c: "t-teoria", dot: "#3b82f6" },
      { k: "Quest\u00f5es", l: "QUEST\u00d5ES", c: "t-questoes", dot: "#ef4444" },
      { k: "Pr\u00e1tica", l: "PR\u00c1TICA", c: "t-pratica", dot: "#f59e0b" },
      { k: "Simulado", l: "SIMULADO", c: "t-simulado", dot: "#1e293b" },
      { k: "revisao", l: "REVIS\u00c3O", c: "t-revisao", dot: "#8b5cf6" },
      { k: "pausa", l: "PAUSA", c: "t-pausa", dot: "#94a3b8" },
      { k: "descanso", l: "DESCANSO", c: "t-descanso", dot: "#22c55e" },
      { k: "prep", l: "ROTINA", c: "t-prep", dot: "#64748b" },
    ];
    const TM = {}; TYPES.forEach(t => TM[t.k] = t);
    const DAYS = ["SEG", "TER", "QUA", "QUI", "SEX", "S\u00c1B", "DOM"];
    const KEY = "lumed-crono-v2";

    const base = () => ({
      rows: [
        { time: "07:30 \u2013 09:30", cells: [
          { s: "Matem\u00e1tica", t: "Fra\u00e7\u00f5es", tp: "Teoria" },
          { s: "F\u00edsica", t: "Grandezas e unidades SI", tp: "Teoria" },
          { s: "Qu\u00edmica", t: "Modelos at\u00f4micos", tp: "Teoria" },
          { s: "Geografia", t: "Regi\u00f5es do Brasil", tp: "Teoria" },
          { s: "Matem\u00e1tica", t: "Porcentagem e regra de 3", tp: "Teoria" },
          { s: "Simulado", t: "30Q mistas da semana", tp: "Simulado" },
          { s: "Descanso", t: "Dia livre", tp: "descanso" },
        ]},
        { time: "09:30 \u2013 11:00", cells: [
          { s: "Matem\u00e1tica", t: "15 exerc\u00edcios fra\u00e7\u00f5es", tp: "Quest\u00f5es" },
          { s: "F\u00edsica", t: "12 exerc\u00edcios convers\u00e3o", tp: "Quest\u00f5es" },
          { s: "Qu\u00edmica", t: "12 exerc\u00edcios modelos", tp: "Quest\u00f5es" },
          { s: "Geografia", t: "10Q biomas (UEA/UFAM)", tp: "Quest\u00f5es" },
          { s: "Matem\u00e1tica", t: "15 exerc\u00edcios %", tp: "Quest\u00f5es" },
          { s: "Corre\u00e7\u00e3o", t: "Revisar erros do simulado", tp: "revisao" },
          { s: "", t: "", tp: "descanso" },
        ]},
        { time: "11:00 \u2013 12:00", cells: [
          { s: "Pausa", t: "Almo\u00e7o", tp: "pausa" },
          { s: "Pausa", t: "Almo\u00e7o", tp: "pausa" },
          { s: "Pausa", t: "Almo\u00e7o", tp: "pausa" },
          { s: "Pausa", t: "Almo\u00e7o", tp: "pausa" },
          { s: "Pausa", t: "Almo\u00e7o", tp: "pausa" },
          { s: "Pausa", t: "Almo\u00e7o", tp: "pausa" },
          { s: "", t: "", tp: "descanso" },
        ]},
        { time: "12:00 \u2013 14:00", cells: [
          { s: "Portugu\u00eas", t: "Classes de palavras", tp: "Teoria" },
          { s: "Hist\u00f3ria", t: "Brasil Col\u00f4nia", tp: "Teoria" },
          { s: "Biologia", t: "C\u00e9lula e organelas", tp: "Teoria" },
          { s: "Reda\u00e7\u00e3o", t: "Estrutura ENEM", tp: "Teoria" },
          { s: "Portugu\u00eas", t: "Sujeito e predicado", tp: "Teoria" },
          { s: "Filosofia", t: "S\u00f3crates e mai\u00eautica", tp: "Teoria" },
          { s: "Planejamento", t: "Preparar Semana 2", tp: "prep" },
        ]},
        { time: "14:00 \u2013 15:30", cells: [
          { s: "Portugu\u00eas", t: "12 exerc\u00edcios + textos", tp: "Quest\u00f5es" },
          { s: "Hist\u00f3ria", t: "10Q ENEM Col\u00f4nia", tp: "Quest\u00f5es" },
          { s: "Biologia", t: "10 exerc\u00edcios c\u00e9lula", tp: "Quest\u00f5es" },
          { s: "Reda\u00e7\u00e3o", t: "Analisar 2 reda\u00e7\u00f5es 1000", tp: "Pr\u00e1tica" },
          { s: "Portugu\u00eas", t: "12 exerc\u00edcios sint\u00e1tica", tp: "Quest\u00f5es" },
          { s: "Sociologia", t: "10Q Fil/Soc ENEM", tp: "Quest\u00f5es" },
          { s: "", t: "", tp: "descanso" },
        ]},
        { time: "20:00 \u2013 20:45", cells: [
          { s: "Revis\u00e3o", t: "Anki 10 flashcards", tp: "revisao" },
          { s: "Revis\u00e3o", t: "Anki + 10 novos", tp: "revisao" },
          { s: "Revis\u00e3o", t: "Anki acumulado", tp: "revisao" },
          { s: "Revis\u00e3o", t: "Anki + reda\u00e7\u00e3o", tp: "revisao" },
          { s: "Revis\u00e3o", t: "Revis\u00e3o geral", tp: "revisao" },
          { s: "", t: "", tp: "pausa" },
          { s: "", t: "", tp: "descanso" },
        ]},
      ]
    });

    const load = () => { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e){} return base(); };

    /* ---- Type dropdown ---- */
    const Drop = ({ onPick, onClose }) => {
      const r = useRef();
      useEffect(() => {
        const h = e => { if (r.current && !r.current.contains(e.target)) onClose(); };
        document.addEventListener("mousedown", h);
        return () => document.removeEventListener("mousedown", h);
      }, [onClose]);
      return (
        <div className="tdrop" ref={r}>
          {TYPES.map(t => (
            <button key={t.k} onClick={() => onPick(t.k)}>
              <span className="dot" style={{ background: t.dot }} />
              {t.l}
            </button>
          ))}
        </div>
      );
    };

    /* ---- Cell ---- */
    const Cell = ({ d, onChange }) => {
      const [drop, setDrop] = useState(false);
      if (!d.s && !d.t) return (
        <div className="cell-empty" onClick={() => onChange({ s: "Mat\u00e9ria", t: "T\u00f3pico", tp: "Teoria" })}>+</div>
      );
      const tp = TM[d.tp] || TM["prep"];
      return (
        <div className="cell" style={{ position: "relative" }}>
          <button className={`tbadge ${tp.c}`} onClick={() => setDrop(!drop)}>{tp.l}</button>
          {drop && <Drop onPick={k => { onChange({ ...d, tp: k }); setDrop(false); }} onClose={() => setDrop(false)} />}
          <br/>
          <input className="cell-subj" value={d.s} onChange={e => onChange({ ...d, s: e.target.value })} placeholder="Mat\u00e9ria" />
          <textarea className="cell-topic" value={d.t} onChange={e => onChange({ ...d, t: e.target.value })} placeholder="T\u00f3pico" rows={1} />
        </div>
      );
    };

    /* ---- Modal ---- */
    const Modal = ({ onAdd, onClose }) => {
      const [v, setV] = useState("");
      return (
        <div className="overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>Novo hor\u00e1rio</h3>
            <input placeholder="Ex: 16:00 \u2013 17:30" value={v} onChange={e => setV(e.target.value)} autoFocus />
            <div className="modal-btns">
              <button className="btn-cancel" onClick={onClose}>Cancelar</button>
              <button className="btn-ok" onClick={() => { if (v.trim()) onAdd(v.trim()); onClose(); }}>Adicionar</button>
            </div>
          </div>
        </div>
      );
    };

    /* ---- App ---- */
    function App() {
      const [data, setData] = useState(load);
      const [modal, setModal] = useState(false);
      useEffect(() => { localStorage.setItem(KEY, JSON.stringify(data)); }, [data]);

      const upCell = (ri, ci, nc) => setData(p => {
        const n = JSON.parse(JSON.stringify(p));
        n.rows[ri].cells[ci] = nc;
        return n;
      });
      const upTime = (ri, t) => setData(p => {
        const n = JSON.parse(JSON.stringify(p));
        n.rows[ri].time = t;
        return n;
      });
      const addRow = t => setData(p => {
        const n = JSON.parse(JSON.stringify(p));
        n.rows.push({ time: t, cells: DAYS.map(() => ({ s: "", t: "", tp: "Teoria" })) });
        return n;
      });
      const delRow = i => { if (confirm("Apagar linha?")) setData(p => { const n = JSON.parse(JSON.stringify(p)); n.rows.splice(i,1); return n; }); };

      return (
        <div>
          <div className="header">
            <h1><i className="bi bi-calendar-week" style={{ marginRight: 8 }} />CRONOGRAMA SEMANAL</h1>
            <div className="header-actions">
              <button onClick={() => setModal(true)} title="Adicionar hor\u00e1rio"><i className="bi bi-plus-lg" /></button>
              <button onClick={() => { if (confirm("Resetar tudo?")) setData(base()); }} title="Resetar"><i className="bi bi-arrow-counterclockwise" /></button>
            </div>
          </div>

          <div className="table-wrap">
            <div className="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>HOR\u00c1RIO</th>
                    {DAYS.map(d => <th key={d}>{d}</th>)}
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  {data.rows.map((row, ri) => (
                    <tr key={ri}>
                      <td className="td-time">
                        <input value={row.time} onChange={e => upTime(ri, e.target.value)} />
                      </td>
                      {row.cells.map((c, ci) => (
                        <td key={ci}><Cell d={c} onChange={nc => upCell(ri, ci, nc)} /></td>
                      ))}
                      <td style={{ textAlign: "center", verticalAlign: "middle" }}>
                        <button className="del-btn" onClick={() => delRow(ri)} title="Apagar"><i className="bi bi-x" /></button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <div className="footer">
            <i className="bi bi-mortarboard-fill" style={{ marginRight: 4 }} />
            Plataforma LuMED
          </div>

          {modal && <Modal onAdd={addRow} onClose={() => setModal(false)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
