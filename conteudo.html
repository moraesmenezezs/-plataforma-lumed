  <script>
    (function(){
      // Atualizar foguinho com dias de login
      const dias = JSON.parse(localStorage.getItem('lumed_logins') || '[]');
      const fire = document.getElementById('streak-fire');
      const count = document.getElementById('streak-fire-count');
      if (fire && count) {
        count.textContent = dias.length;
        fire.title = dias.length + ' dia' + (dias.length !== 1 ? 's' : '') + ' na plataforma';
      }
    })();
  </script>
